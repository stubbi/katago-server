[package]
name = "katago-server"
version = "1.8.0"
edition = "2024"
rust-version = "1.88"
description = "Production-grade REST API server for the KataGo Go engine"
license = "MIT"
repository = "https://github.com/goban-app/katago-server"
homepage = "https://github.com/goban-app/katago-server"
readme = "README.md"
keywords = ["katago", "go", "baduk", "weiqi", "rest-api"]
categories = ["games", "web-programming::http-server"]
publish = false

[[bin]]
name = "katago-server"
path = "src/main.rs"

[lib]
name = "katago_server"
path = "src/lib.rs"

[dependencies]
# Web framework and middleware
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["limit", "load-shed", "timeout", "util"] }
tower-http = { version = "0.7", features = ["trace", "cors", "timeout", "limit", "request-id", "util"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "signal"] }

# Serialization and configuration
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive", "env"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# API documentation
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-scalar = { version = "0.3", features = ["axum"] }

# Utilities
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that hurt more than they help for this codebase
module_name_repetitions = "allow"
# "KataGo" and "OpenAPI" are proper nouns, not code
doc_markdown = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
struct_excessive_bools = "allow"
# ApiError is ~136 bytes; boxing it would only obscure the handlers
result_large_err = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# Keep unwinding: a panic in one request handler must not take the whole server down.
panic = "unwind"
