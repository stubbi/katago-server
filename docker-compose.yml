services:
  # CPU image with KataGo and the standard 28-block network bundled.
  katago-server:
    image: ghcr.io/goban-app/katago-server:latest
    # Or build locally:
    # build:
    #   context: .
    #   target: cpu
    ports:
      - "2718:2718"
    environment:
      RUST_LOG: info
      # KATAGO_SERVER_LOG_FORMAT: json
      # KATAGO_SERVER_CORS_ALLOWED_ORIGINS: https://goban.app
      # KATAGO_MOVE_TIMEOUT_SECS: "60"
      # KATAGO_DEFAULT_MAX_VISITS: "50"
      # KATAGO_MAX_VISITS_LIMIT: "2000"
    # volumes:
    #   - ./analysis_config.cfg:/app/analysis_config.cfg:ro
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/app/katago-server", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

