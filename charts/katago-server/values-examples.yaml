# Example values for common deployment scenarios. Copy one block into your own
# values file. Every block is standalone.

# ==============================================================================
# Example 1: CPU with resource limits (the default image bundles KataGo + network)
# ==============================================================================
# resources:
#   limits:
#     cpu: 4000m
#     memory: 3Gi
#   requests:
#     cpu: 2000m
#     memory: 1Gi
#
# config:
#   logLevel: info
#   logFormat: json
#   katago:
#     moveTimeoutSecs: 60
#     defaultMaxVisits: 50
#     maxVisitsLimit: 2000

# ==============================================================================
# Example 2: Download a different network with an init container
# ==============================================================================
# config:
#   customModel:
#     enabled: true
#     url: "https://media.katagotraining.org/uploaded/networks/models/kata1/kata1-b18c384nbt-s9996604416-d4316597426.bin.gz"
#     filename: "kata1-b18c384nbt.bin.gz"
#     # sha256sum: "<sha256 of the file>"

# ==============================================================================
# Example 3: GPU (CUDA image, NVIDIA device plugin installed)
# ==============================================================================
# image:
#   variant: "-gpu"
#
# gpu:
#   enabled: true
#   count: 1
#   vendor: nvidia
#
# resources:
#   limits:
#     memory: 4Gi
#   requests:
#     cpu: 1000m
#     memory: 2Gi
#
# tolerations:
#   - key: nvidia.com/gpu
#     operator: Exists
#     effect: NoSchedule
#
# config:
#   katago:
#     analysisConfig: |
#       logDir = analysis_logs
#       reportAnalysisWinratesAs = SIDETOMOVE
#       numAnalysisThreads = 4
#       numSearchThreadsPerAnalysisThread = 8
#       nnMaxBatchSize = 32
#       numNNServerThreadsPerModel = 1
#       nnCacheSizePowerOfTwo = 22

# ==============================================================================
# Example 4: Production with autoscaling, ingress, metrics
# ==============================================================================
# replicaCount: 3
#
# resources:
#   limits:
#     cpu: 4000m
#     memory: 3Gi
#   requests:
#     cpu: 2000m
#     memory: 1Gi
#
# autoscaling:
#   enabled: true
#   minReplicas: 3
#   maxReplicas: 10
#   targetCPUUtilizationPercentage: 70
#
# podDisruptionBudget:
#   enabled: true
#   minAvailable: 2
#
# ingress:
#   enabled: true
#   className: nginx
#   annotations:
#     cert-manager.io/cluster-issuer: letsencrypt-prod
#   hosts:
#     - host: katago.example.com
#       paths:
#         - path: /
#           pathType: Prefix
#   tls:
#     - secretName: katago-tls
#       hosts:
#         - katago.example.com
#
# config:
#   logLevel: warn
#   logFormat: json
#   corsAllowedOrigins:
#     - https://goban.app
#   maxConcurrentRequests: 64
#
# serviceMonitor:
#   enabled: true
#   interval: 30s

# ==============================================================================
# Example 5: Minimal variant with KataGo and network from a PVC
# ==============================================================================
# image:
#   variant: "-minimal"
#
# volumes:
#   - name: katago-models
#     persistentVolumeClaim:
#       claimName: katago-models-pvc
#
# volumeMounts:
#   - name: katago-models
#     mountPath: /models
#     readOnly: true
#
# config:
#   katago:
#     path: /models/katago
#     modelPath: /models/kata1-b28c512nbt-s12043015936-d5616446734.bin.gz
#     configPath: /models/analysis_config.cfg
#     # The chart's analysisConfig is mounted at /app/analysis_config.cfg; point
#     # configPath there instead if you prefer to manage the .cfg in values.
#     analysisConfig: ""

# ==============================================================================
# Example 6: Full config.toml instead of environment variables
# ==============================================================================
# config:
#   customConfig: |
#     [server]
#     host = "::"
#     port = 2718
#     cors_allowed_origins = ["https://goban.app"]
#
#     [katago]
#     katago_path = "/app/katago"
#     model_path = "/app/kata1-b28c512nbt-s12043015936-d5616446734.bin.gz"
#     config_path = "/app/analysis_config.cfg"
#     move_timeout_secs = 60
#     default_max_visits = 50

