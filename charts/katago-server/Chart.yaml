apiVersion: v2
name: katago-server
description: REST API server for the KataGo Go engine - position and game analysis over HTTP
type: application

# Chart version. Bumping this on main triggers a release of the Docker images,
# the chart and a git tag (see RELEASING.md). Keep it equal to appVersion.
version: 1.8.0

# Version of katago-server deployed by this chart. Must match Cargo.toml.
appVersion: "1.8.0"

keywords:
  - katago
  - go
  - baduk
  - weiqi
  - ai
  - rest-api

home: https://github.com/goban-app/katago-server
sources:
  - https://github.com/goban-app/katago-server

maintainers:
  - name: goban-app
    url: https://github.com/goban-app

icon: https://raw.githubusercontent.com/lightvector/KataGo/master/images/icon.png
