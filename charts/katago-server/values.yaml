# Default values for katago-server.

replicaCount: 1

image:
  repository: ghcr.io/goban-app/katago-server
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  # Image variant suffix:
  #   ""            CPU with the standard network (default)
  #   "-cpu"        same as "", explicit
  #   "-gpu"        CUDA build with the standard network (set gpu.enabled)
  #   "-human-cpu"  / "-human-gpu"  Human SL network only
  #   "-combo-cpu"  / "-combo-gpu"  standard + Human SL network
  #   "-minimal"    no KataGo/model bundled; mount them and set config.katago.* paths
  #   "-base"       server binary only
  variant: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  # KataGo writes its own log files under /app/analysis_logs, so the root
  # filesystem cannot be read-only yet. Mount an emptyDir there and flip this
  # to true if you need it.
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 2718
  targetPort: 2718
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/tls-acme: "true"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: katago-server.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: katago-server-tls
  #    hosts:
  #      - katago-server.local

resources: {}
  # CPU variant, b28 network:
  # limits:
  #   cpu: 4000m
  #   memory: 3Gi
  # requests:
  #   cpu: 2000m
  #   memory: 1Gi
  # GPU variant (the GPU itself is requested through gpu.*):
  # limits:
  #   memory: 4Gi
  # requests:
  #   cpu: 1000m
  #   memory: 2Gi

# Liveness fails only when KataGo is down and the server has given up restarting it.
livenessProbe:
  httpGet:
    path: /api/v1/health/live
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Readiness passes once KataGo has loaded its network and answered a query.
readinessProbe:
  httpGet:
    path: /api/v1/health/ready
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Startup protects liveness while the network loads. Loading a 28-block network
# on CPU can take a few minutes: 60 x 5s = 5 minutes.
startupProbe:
  httpGet:
    path: /api/v1/health/ready
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 60

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes / volumeMounts on the Deployment.
volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

podDisruptionBudget:
  enabled: false
  # minAvailable: 1
  # maxUnavailable: 1

# katago-server configuration. Every value maps to one environment variable;
# unset values keep the image defaults.
config:
  # RUST_LOG filter (trace, debug, info, warn, error or a full directive).
  logLevel: info
  # KATAGO_SERVER_LOG_FORMAT: "text" or "json". Empty keeps the server default (text).
  logFormat: ""
  # KATAGO_SERVER_CORS_ALLOWED_ORIGINS. Empty list keeps the server default ("*").
  corsAllowedOrigins: []
  # KATAGO_SERVER_MAX_CONCURRENT_REQUESTS (requests beyond this get 503).
  maxConcurrentRequests: null
  # KATAGO_SERVER_REQUEST_TIMEOUT_SECS (must be >= katago.moveTimeoutSecs).
  requestTimeoutSecs: null

  katago:
    # Paths for the -minimal variant or custom mounts. Leave empty for bundled
    # images, which already know where their katago, model and config live.
    # KATAGO_KATAGO_PATH
    path: ""
    # KATAGO_MODEL_PATH
    modelPath: ""
    # KATAGO_HUMAN_MODEL_PATH
    humanModelPath: ""
    # KATAGO_CONFIG_PATH (the KataGo analysis .cfg, not config.toml)
    configPath: ""
    # KATAGO_MOVE_TIMEOUT_SECS: seconds to wait per analysed position.
    moveTimeoutSecs: 60
    # KATAGO_DEFAULT_MAX_VISITS: applied when a request has no maxVisits.
    defaultMaxVisits: null
    # KATAGO_MAX_VISITS_LIMIT: requests asking for more are rejected with 400.
    maxVisitsLimit: null
    # KATAGO_MAX_RESTART_ATTEMPTS: restarts before liveness fails.
    maxRestartAttempts: null

    # KataGo analysis engine configuration, mounted over /app/analysis_config.cfg.
    # Set to "" to keep the file bundled in the image.
    analysisConfig: |
      # KataGo Analysis Engine Configuration
      logDir = analysis_logs
      logSearchInfo = false
      logAllRequests = false
      logAllResponses = false

      reportAnalysisWinratesAs = SIDETOMOVE
      # maxVisits is left unset so every request (or KATAGO_DEFAULT_MAX_VISITS) controls it.

      numAnalysisThreads = 1
      numSearchThreadsPerAnalysisThread = 1

      nnMaxBatchSize = 8
      numNNServerThreadsPerModel = 2

      nnCacheSizePowerOfTwo = 20

  # Download a network with an init container before the server starts.
  # The file lands in /app/models/<filename> and KATAGO_MODEL_PATH is set to it.
  customModel:
    enabled: false
    # e.g. https://media.katagotraining.org/uploaded/networks/models/kata1/kata1-b28c512nbt-s12043015936-d5616446734.bin.gz
    url: ""
    filename: "custom-model.bin.gz"
    # Optional SHA256 to verify the download.
    sha256sum: ""
    initImage: "busybox:1.36"
    initResources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi

  # A complete config.toml. Mounted at /config/config.toml and selected through
  # KATAGO_CONFIG_FILE. Environment variables above still take precedence.
  customConfig: ""
  #  customConfig: |
  #    [server]
  #    host = "::"
  #    port = 2718
  #
  #    [katago]
  #    katago_path = "/app/katago"
  #    model_path = "/app/models/custom-model.bin.gz"
  #    config_path = "/app/analysis_config.cfg"
  #    move_timeout_secs = 60

gpu:
  enabled: false
  count: 1
  # nvidia or amd
  vendor: nvidia

# Extra environment variables / sources.
env: []
# - name: KATAGO_SERVER_MAX_BODY_BYTES
#   value: "2097152"
envFrom: []

priorityClassName: ""
topologySpreadConstraints: []
lifecycle: {}
dnsPolicy: ClusterFirst
dnsConfig: {}
hostAliases: []

# Prometheus Operator ServiceMonitor scraping /metrics.
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  additionalLabels: {}
