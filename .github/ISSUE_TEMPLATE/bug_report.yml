name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Server version
      description: Output of `GET /api/v1/version` (or the image tag)
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The request you sent (curl is ideal) and the response you got
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
  - type: textarea
    id: logs
    attributes:
      label: Server logs
      description: Run with `RUST_LOG=debug` if possible
      render: text
