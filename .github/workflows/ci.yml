name: CI

# Runs on every push to main and every pull request.
# Docker images are only built here; publishing happens in release.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  # ---------------------------------------------------------------------------
  # Rust
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets --locked
      - run: cargo test --doc --locked

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV (rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: msrv
        run: echo "version=$(grep '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked

  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  # ---------------------------------------------------------------------------
  # Everything that is not Rust
  # ---------------------------------------------------------------------------
  scripts:
    name: Shell, Docker and Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning setup.sh test.sh docker-setup.sh
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
      - uses: azure/setup-helm@v4
      - name: helm lint and template
        run: |
          set -euo pipefail
          helm lint charts/katago-server
          helm template test charts/katago-server > /dev/null
          helm template test charts/katago-server --set-string config.customConfig='[server]' > /dev/null
          helm template test charts/katago-server \
            --set config.customModel.enabled=true \
            --set config.customModel.url=https://example.invalid/model.bin.gz > /dev/null
          helm template test charts/katago-server --set gpu.enabled=true --set serviceMonitor.enabled=true > /dev/null

  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cargo.toml, Cargo.lock, Chart.yaml and CHANGELOG agree
        run: |
          set -euo pipefail
          CARGO=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          LOCK=$(awk '/^name = "katago-server"/{getline; print}' Cargo.lock | cut -d'"' -f2)
          CHART=$(grep -m1 '^version:' charts/katago-server/Chart.yaml | awk '{print $2}')
          APP=$(grep -m1 '^appVersion:' charts/katago-server/Chart.yaml | awk '{print $2}' | tr -d '"')
          echo "Cargo.toml=$CARGO Cargo.lock=$LOCK Chart.version=$CHART Chart.appVersion=$APP"
          [ "$CARGO" = "$LOCK" ] || { echo "::error::Cargo.lock is stale, run cargo update -p katago-server"; exit 1; }
          [ "$CARGO" = "$CHART" ] || { echo "::error::Cargo.toml version and Chart.yaml version differ"; exit 1; }
          [ "$CARGO" = "$APP" ] || { echo "::error::Cargo.toml version and Chart.yaml appVersion differ"; exit 1; }
          grep -q "^## \[$CARGO\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $CARGO"; exit 1; }

  # ---------------------------------------------------------------------------
  # Docker: build (no push) and smoke test the CPU image with a real KataGo
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker build (${{ matrix.target }})
    needs: [test, lint]
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: base
            platforms: linux/amd64,linux/arm64
          - target: minimal
            platforms: linux/amd64,linux/arm64
          - target: cpu
            platforms: linux/amd64,linux/arm64
          - target: human-cpu
            platforms: linux/amd64
          - target: combo-cpu
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: false
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: |
            type=gha,scope=${{ matrix.target }}-${{ github.ref_name }}
            type=gha,scope=${{ matrix.target }}-main
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ github.ref_name }}
      - name: Export amd64 image for smoke test
        if: matrix.target == 'cpu'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: cpu
          platforms: linux/amd64
          tags: katago-server:ci-cpu
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: |
            type=gha,scope=cpu-${{ github.ref_name }}
            type=gha,scope=cpu-main
          outputs: type=docker,dest=/tmp/katago-server-cpu.tar
      - if: matrix.target == 'cpu'
        uses: actions/upload-artifact@v4
        with:
          name: katago-server-cpu-image
          path: /tmp/katago-server-cpu.tar
          retention-days: 1

  docker-smoke:
    name: Docker smoke test (cpu)
    needs: docker-build
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: katago-server-cpu-image
          path: /tmp
      - run: docker load --input /tmp/katago-server-cpu.tar
      - name: Start container
        run: docker run -d --name katago -p 2718:2718 katago-server:ci-cpu
      - name: Smoke test
        env:
          READY_TIMEOUT: 240
        run: ./test.sh localhost:2718
      - name: Container health and clean shutdown
        run: |
          set -euo pipefail
          docker inspect --format 'health={{.State.Health.Status}}' katago
          docker stop -t 30 katago
          EXIT=$(docker inspect --format '{{.State.ExitCode}}' katago)
          echo "exit code $EXIT"
          [ "$EXIT" = "0" ] || { echo "::error::container did not exit cleanly on SIGTERM"; exit 1; }
      - if: always()
        run: docker logs katago 2>&1 | tail -60
