name: Release

# Releases are driven by charts/katago-server/Chart.yaml on main:
#   1. bump Cargo.toml, Cargo.lock, CHANGELOG.md and Chart.yaml (version + appVersion)
#      to the same X.Y.Z in a PR (CI's "Version consistency" job enforces it)
#   2. merge -> this workflow builds and pushes every image variant, publishes the
#      Helm chart to GitHub Pages, creates tag vX.Y.Z and a GitHub release.

on:
  push:
    branches: [main]
    paths:
      - charts/katago-server/Chart.yaml
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/katago-server

jobs:
  version:
    name: Detect version change
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
      previous: ${{ steps.check.outputs.previous }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: check
        run: |
          set -euo pipefail
          CURRENT=$(grep -m1 '^version:' charts/katago-server/Chart.yaml | awk '{print $2}')
          PREVIOUS=$(git show HEAD^:charts/katago-server/Chart.yaml 2>/dev/null | grep -m1 '^version:' | awk '{print $2}' || true)
          CARGO=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "chart=$CURRENT previous=$PREVIOUS cargo=$CARGO"
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "$PREVIOUS" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$CURRENT" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' \
            || { echo "::error::$CURRENT is not a semantic version"; exit 1; }
          [ "$CURRENT" = "$CARGO" ] || { echo "::error::Chart.yaml ($CURRENT) and Cargo.toml ($CARGO) disagree"; exit 1; }
          if git rev-parse "v$CURRENT" >/dev/null 2>&1; then
            echo "::error::tag v$CURRENT already exists"; exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

  images:
    name: Image (${{ matrix.target }})
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: base
            platforms: linux/amd64,linux/arm64
          - target: minimal
            platforms: linux/amd64,linux/arm64
          - target: cpu
            platforms: linux/amd64,linux/arm64
          - target: human-cpu
            platforms: linux/amd64,linux/arm64
          - target: combo-cpu
            platforms: linux/amd64,linux/arm64
          - target: gpu
            platforms: linux/amd64
          - target: human-gpu
            platforms: linux/amd64
          - target: combo-gpu
            platforms: linux/amd64
    steps:
      - name: Free disk space (CUDA builds)
        if: contains(matrix.target, 'gpu')
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/julia*
          sudo docker image prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}-${{ matrix.target }}
            type=raw,value=latest-${{ matrix.target }}
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ matrix.target == 'cpu' }}
            type=raw,value=latest,enable=${{ matrix.target == 'cpu' }}
          labels: |
            org.opencontainers.image.title=katago-server (${{ matrix.target }})
            org.opencontainers.image.description=REST API server for the KataGo Go engine, ${{ matrix.target }} variant
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=MIT
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}-main
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-main
          provenance: false
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  helm:
    name: Publish Helm chart
    needs: [version, images]
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: azure/setup-helm@v4
      - uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Tag and GitHub release
    needs: [version, images, helm]
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Create tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
      - name: Extract changelog section
        id: notes
        run: |
          set -euo pipefail
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > release-notes.md
          echo "--- release notes ---"; cat release-notes.md
      - name: Append image and chart pointers
        run: |
          cat >> release-notes.md <<EOF

          ## Images

          \`\`\`
          ghcr.io/goban-app/katago-server:${VERSION}           # cpu (default), also :latest
          ghcr.io/goban-app/katago-server:${VERSION}-gpu       # CUDA, also -human-gpu, -combo-gpu
          ghcr.io/goban-app/katago-server:${VERSION}-human-cpu # Human SL network, also -combo-cpu
          ghcr.io/goban-app/katago-server:${VERSION}-minimal   # bring your own KataGo (/models)
          ghcr.io/goban-app/katago-server:${VERSION}-base      # server binary only
          \`\`\`

          ## Helm

          \`\`\`
          helm repo add katago-server https://goban-app.github.io/katago-server
          helm install katago katago-server/katago-server --version ${VERSION}
          \`\`\`
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          body_path: release-notes.md
          generate_release_notes: true
